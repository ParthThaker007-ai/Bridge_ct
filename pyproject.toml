[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-ct"
version = "1.0.0"
description = "BRIDGE-CT: temporal collaboration-network analysis and link prediction for biomedical research communities"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "networkx>=3.2",
  "scikit-learn>=1.3",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "streamlit>=1.30",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
leiden = ["python-igraph>=0.11", "leidenalg>=0.10"]

[project.scripts]
bridge-ct = "bridge_ct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
